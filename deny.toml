[advisories]
# Severity defaults: vulnerabilities fail the check; unmaintained and yanked
# crates warn. Applies to the standalone deny.yml workflow and the nix-gate
# cargoDeny check alike.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
