# fastpass — a generic priority-merge of two FIFO streams into one consumer.
#
# This is the standalone, transport-agnostic distillation of bombay card #225
# ("control-signal lane"): runtime control signals must not queue behind a user
# backlog. Solved here as a self-contained CS component so it can be tested
# every way and then plugged into bombay's mailbox.
[workspace]
resolver = "3"
members = [
  "crates/fastpass",
  "crates/fastpass-reference",
  "crates/fastpass-testkit",
  "crates/fastpass-perf",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/fastpass"

[workspace.dependencies]
flume = "0.12"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
criterion = { version = "0.8", features = ["async_tokio"] }
fastpass = { path = "crates/fastpass" }
fastpass-reference = { path = "crates/fastpass-reference" }
fastpass-testkit = { path = "crates/fastpass-testkit" }

# Keep the research crates lint-honest without importing bombay's full god-tier
# config — this is a spike, but the invariants are real.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
