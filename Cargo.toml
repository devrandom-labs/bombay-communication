[workspace]
resolver = "2"
members = [
    "crates/communication",
    "crates/communication-perf",
    "crates/communication-reference",
    "crates/communication-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/bombay-communication"
homepage = "https://devrandom-labs.github.io/bombay-communication/"

[workspace.dependencies]
communication = { package = "bombay-communication", path = "crates/communication" }
communication-reference = { package = "bombay-communication-reference", path = "crates/communication-reference" }
communication-testkit = { package = "bombay-communication-testkit", path = "crates/communication-testkit" }
criterion = { version = "0.8", features = ["async_tokio"] }
flume = "0.12"
loom = "0.7"
parking_lot = "0.12"
proptest = "1.11"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.metadata.crane]
name = "bombay-communication"
